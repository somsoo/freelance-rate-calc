            if (workingDays <= 0 || workingHours <= 0) {
              alert("洹쇰Т ?쇱닔? 洹쇰Т ?쒓컙? 1 ?댁긽?댁뼱???⑸땲??");
              return;
            }

            // Formulas
            const targetGross = (targetNet / (1 - taxRate)) + expenses;
            const taxAmount = targetGross - targetNet - expenses;

            const totalHours = workingDays * workingHours;
            const billableHours = totalHours * (1 - overheadRate);

            if (billableHours <= 0) {
              alert("鍮꾧????쒓컙 鍮꾩쑉???덈Т ?믪븘 泥?뎄 媛?ν븳 ?쒓컙??議댁옱?섏? ?딆뒿?덈떎.");
              return;
            }

            const hourlyRate = targetGross / billableHours;
            const dailyRate = hourlyRate * workingHours;
            
            const manMonthRate = targetGross;

            // Update Date
            const now = new Date();
            const formattedDate = `DATE: ${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            document.getElementById('receiptDate').innerText = formattedDate;

            // Set values to DOM
            document.getElementById('recNet').innerText = formatKRW(targetNet);
            document.getElementById('recTax').innerText = formatKRW(taxAmount);
            document.getElementById('recExpenses').innerText = '+ ' + formatKRW(expenses);
            document.getElementById('recGross').innerText = formatKRW(targetGross);
            
            document.getElementById('recTotalHours').innerText = `${totalHours} ?쒓컙`;
            document.getElementById('recOverhead').innerText = `${overheadRate * 100} %`;
            document.getElementById('recBillableHours').innerText = `${billableHours.toFixed(1)} ?쒓컙`;

            document.getElementById('recHourlyRate').innerText = formatKRW(hourlyRate);
            document.getElementById('recDailyRate').innerText = formatKRW(dailyRate);
            document.getElementById('recManMonthRate').innerText = formatKRW(manMonthRate);

            // Show Receipt
            const receipt = document.getElementById('receiptArea');
            receipt.classList.remove('hidden');
            receipt.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        </script>
